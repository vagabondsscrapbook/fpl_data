name: Update FPL Data

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC every day.
    # Adjust to taste - e.g. add extra runs around Saturday/Sunday
    # matches and Monday-morning price changes if you want fresher
    # data on those days specifically.
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest FPL data
        run: python fetch_fpl.py

      - name: Commit and push if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@github.com"
          for f in players.csv teams.csv fixtures.csv meta.json history.csv past_seasons.csv matches_fd.csv fixtures_odds.csv players_extra.csv news_log.csv understat_players.csv understat_matches.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "Update FPL data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
